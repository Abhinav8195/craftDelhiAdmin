name: Deploy React Admin to EC2

on:
  push:
    branches:
      - main   # change if needed

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🟢 Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: 📦 Install dependencies
        run: npm ci

      - name: ⚙️ Create .env file
        run: |
          echo "REACT_APP_BASE_URL=${{ secrets.REACT_APP_BASE_URL }}" >> .env
          echo "REACT_APP_ADMIN_ID=${{ secrets.REACT_APP_ADMIN_ID }}" >> .env
          echo "REACT_APP_CHAT_API_BASE=${{ secrets.REACT_APP_CHAT_API_BASE }}" >> .env
          echo "REACT_APP_SOCKET_URL=${{ secrets.REACT_APP_SOCKET_URL }}" >> .env

      - name: 🏗️ Build project
        run: npm run build

      # 🔥 Clean old build on server
      - name: 🧹 Clean old files on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            rm -rf /var/www/html/craftDelhiAdmin/*

      # 🚀 Upload new build
      - name: 📤 Upload build to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/*"
          target: "/var/www/html/craftDelhiAdmin"

      - name: ✅ Done
        run: echo "Deployment completed successfully"