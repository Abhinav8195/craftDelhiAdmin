name: Deploy React Admin to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 📥 Checkout
      - name: Checkout code
        uses: actions/checkout@v3

      # 🟢 Node setup
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # ⚡ Cache (faster builds)
      - name: Cache npm
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      # 📦 Install (safe without lock file)
      - name: Install dependencies
        run: npm ci

      # ⚙️ Create env
      - name: Create .env
        run: |
          echo "REACT_APP_BASE_URL=${{ secrets.REACT_APP_BASE_URL }}" >> .env
          echo "REACT_APP_ADMIN_ID=${{ secrets.REACT_APP_ADMIN_ID }}" >> .env
          echo "REACT_APP_CHAT_API_BASE=${{ secrets.REACT_APP_CHAT_API_BASE }}" >> .env
          echo "REACT_APP_SOCKET_URL=${{ secrets.REACT_APP_SOCKET_URL }}" >> .env

      # 🏗️ Build (ignore warnings in CI)
      - name: Build project
        run: CI=false npm run build

      # 🧹 Prepare temp folder on EC2
      - name: Prepare deploy directory
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /var/www/html/craftDelhiAdmin_new
            rm -rf /var/www/html/craftDelhiAdmin_new/*

      # 📤 Upload build to temp folder
      - name: Upload build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/*"
          target: "/var/www/html/craftDelhiAdmin_new/"

      # 🔄 Swap folders (zero downtime)
      - name: 🔄 Switch build
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # remove old backup
            rm -rf /var/www/html/craftDelhiAdmin_backup

            # move current to backup
            mv /var/www/html/craftDelhiAdmin /var/www/html/craftDelhiAdmin_backup || true

            # 🔥 IMPORTANT: flatten build folder
            mv /var/www/html/craftDelhiAdmin_new/build/* /var/www/html/craftDelhiAdmin_new/ || true
            rm -rf /var/www/html/craftDelhiAdmin_new/build

            # switch
            mv /var/www/html/craftDelhiAdmin_new /var/www/html/craftDelhiAdmin
            
            # reload apache
            sudo systemctl reload apache2

      # ✅ Done
      - name: Deployment success
        run: echo "🚀 Frontend deployed successfully!"